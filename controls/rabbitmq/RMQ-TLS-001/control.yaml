id: RMQ-TLS-001
component: rabbitmq
category: crypto-transit
title: "RabbitMQ TLS listeners must enforce TLSv1.2 as minimum version and exclude TLSv1.0 and TLSv1.1"
description: |
  Verifies that ssl_options.versions enumerates only TLSv1.2 and/or TLSv1.3.
  TLSv1.0 and TLSv1.1 are deprecated by the IETF and vulnerable to POODLE and
  BEAST attacks. Advertising legacy versions exposes all connections to downgrade
  attacks even when the broker and client both support modern versions.

severity: high

sources:
  - type: vendor_doc
    authority: strong
    title: "RabbitMQ TLS Support — Protocol Versions"
    url: "https://www.rabbitmq.com/docs/ssl"
    section: "#tls-versions"
    accessed_at: "2026-05-17"

check:
  type: file_analysis
  globs:
    - "rabbitmq.conf"
    - "**/rabbitmq.conf"
    - "**/rabbitmq.conf.d/*.conf"
  prompt: |
    Locate ssl_options.versions (new-style config) or the equivalent in
    advanced.config.

    COMPLIANT if:
      - ssl_options.versions is explicitly set and contains only tlsv1.2
        and/or tlsv1.3 — no tlsv1 or tlsv1.1 present.

    NON-COMPLIANT if:
      - ssl_options.versions includes tlsv1 or tlsv1.1.
      - ssl_options.versions includes sslv3.

    NEEDS-HUMAN if:
      - ssl_options.versions is absent — effective default depends on
        Erlang/OTP version and cannot be determined from the config file alone.
      - TLS listeners (ssl_listeners) are not configured — control may not apply.

remediation:
  summary: |
    Explicitly enumerate only tlsv1.2 and tlsv1.3 in ssl_options.versions.
    If all clients support TLSv1.3 (Erlang 26+, Java 11+, .NET 6+), restrict
    to tlsv1.3 exclusively. Never rely on defaults to exclude legacy versions.
  template: |
    # In rabbitmq.conf — TLSv1.2 and TLSv1.3 only:
    ssl_options.versions.1 = tlsv1.3
    ssl_options.versions.2 = tlsv1.2

known_na_reasons: []
