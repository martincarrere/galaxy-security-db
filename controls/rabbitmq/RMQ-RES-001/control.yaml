id: RMQ-RES-001
component: rabbitmq
category: resource-controls
title: "RabbitMQ memory high-watermark must be set between 0.4 and 0.7 of host RAM"
description: |
  Verifies that vm_memory_high_watermark.relative is configured within the
  recommended band (0.4 to 0.7). The watermark is the primary protection against
  memory-exhaustion outages: too low causes unnecessary flow control under legitimate
  load; too high allows the broker to consume so much RAM that the host swaps or the
  OS OOM-kills the broker process. A deliberate publish flood can exploit an absent
  or misconfigured watermark to trigger the OOM condition.

severity: medium

sources:
  - type: vendor_doc
    authority: strong
    title: "RabbitMQ Production Checklist — Memory"
    url: "https://www.rabbitmq.com/docs/production-checklist"
    section: "#resource-limits-ram"
    accessed_at: "2026-05-17"

check:
  type: file_analysis
  globs:
    - "rabbitmq.conf"
    - "**/rabbitmq.conf"
    - "**/rabbitmq.conf.d/*.conf"
  prompt: |
    Locate vm_memory_high_watermark.relative or vm_memory_high_watermark.absolute.

    COMPLIANT if:
      - vm_memory_high_watermark.relative is set to a value >= 0.4 and <= 0.7.

    NON-COMPLIANT if:
      - vm_memory_high_watermark.relative is > 0.7 (too high, risks OOM).
      - vm_memory_high_watermark.relative is = 0 or the directive is absent
        (default 0.4 is acceptable if confirmed, but absence is ambiguous).

    NEEDS-HUMAN if:
      - Only vm_memory_high_watermark.absolute is configured — cannot verify
        the 0.4-0.7 band without knowing total host RAM.
      - Directive is absent — effective default (0.4) may be acceptable but
        cannot be confirmed from the file.

remediation:
  summary: |
    Set vm_memory_high_watermark.relative to a value between 0.4 and 0.7.
    Always ensure at least 256 MiB remain available to the OS. For quorum queues,
    use a lower value (0.4-0.5) to provide additional headroom.
  template: |
    # In rabbitmq.conf:
    vm_memory_high_watermark.relative = 0.5

known_na_reasons: []
