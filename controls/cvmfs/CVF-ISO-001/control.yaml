id: CVF-ISO-001
component: cvmfs
category: isolation
title: "CVMFS FUSE module must run as the dedicated cvmfs user after mount, not as root"
description: |
  Verifies that the CVMFS FUSE module drops root and runs as the unprivileged
  cvmfs system user after mount initialization. The FUSE module parses untrusted
  on-wire data (catalogs, file chunks) from network sources; retaining root
  privileges during this parsing means any exploitable memory-safety bug or logic
  flaw would yield immediate host-wide root access instead of being confined to the
  cvmfs service account.

severity: high

sources:
  - type: vendor_doc
    authority: strong
    title: "CernVM-FS — Security Deep Dive"
    url: "https://cvmfs.readthedocs.io/en/stable/apx-security.html"
    accessed_at: "2026-05-17"

check:
  type: human_review
  globs:
    - "**/systemd/**cvmfs*"
    - "**/*.service"
  prompt: |
    Verify that the running CVMFS FUSE process is owned by the cvmfs user.

    COMPLIANT if:
      - ps aux shows all cvmfs2 worker processes running as the cvmfs user,
        not as root.
      - No systemd unit override or role variable sets the cvmfs2 service user
        to root or any other privileged account.
      - The default CVMFS behavior (drop to cvmfs user after mount) has not been
        modified by any configuration option.

    NON-COMPLIANT if:
      - ps aux shows cvmfs2 processes running as root.
      - A systemd override or config file explicitly sets the runtime user to root.

    NEEDS-HUMAN if:
      - Process ownership must be verified on the live host:
        ps aux | grep cvmfs2 — worker processes should show the cvmfs user.

remediation:
  summary: |
    Remove any override that sets the cvmfs2 service user to root. The default
    CVMFS behavior drops to the cvmfs user after mount and should be preserved.
  template: |
    # Verify on live host:
    ps aux | grep cvmfs2
    # Expected: cvmfs    <pid>  ... /usr/bin/cvmfs2 ...

    # Check for any user override:
    systemctl cat cvmfs@<repo>.service | grep -i user

known_na_reasons: []
