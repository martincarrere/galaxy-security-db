id: CVF-TB-002
component: cvmfs
category: trust-boundary
title: "CVMFS trusted public keys must be scoped per-repository rather than globally or per-domain"
description: |
  Verifies that CVMFS public key trust is configured at the narrowest applicable
  scope — per-repository — rather than at the domain or global level. CVMFS
  accepts a manifest signature if any configured key validates it, regardless of
  scope. A key registered at domain or global scope can authorize content for any
  repository in that domain; a compromised or leaked key at a broad scope therefore
  undermines trust in all repositories under that scope, not just the one it was
  intended for.

severity: high

sources:
  - type: vendor_doc
    authority: strong
    title: "CernVM-FS — Security Deep Dive"
    url: "https://cvmfs.readthedocs.io/en/stable/apx-security.html"
    accessed_at: "2026-05-17"

check:
  type: file_analysis
  globs:
    - "**/etc/cvmfs/default.local"
    - "**/etc/cvmfs/config.d/*.conf"
    - "**/etc/cvmfs/repositories.d/**/server.conf"
    - "**/cvmfs/*.conf"
  prompt: |
    Inspect CVMFS_PUBLIC_KEY and CVMFS_KEYS_DIR configuration across all scopes.

    COMPLIANT if:
      - CVMFS_PUBLIC_KEY is set per-repository in config.d/<repo>.conf or
        repositories.d/<repo>/server.conf, naming the exact .pub file for
        that repository's publisher.
      - The global default.local does not set CVMFS_KEYS_DIR to a directory
        that contains keys for repositories it should not trust.
      - Multiple keys in the same scope exist only to support key rotation
        (old + new key temporarily coexisting).

    NON-COMPLIANT if:
      - Only CVMFS_KEYS_DIR is set globally, without per-repository
        CVMFS_PUBLIC_KEY refinements.
      - A single .pub key file is trusted for all repositories without
        any per-repository scoping.

    NEEDS-HUMAN if:
      - The effective configuration requires running cvmfs_config showconfig
        <repo> on the live host to determine which keys are trusted per repository.

remediation:
  summary: |
    Set CVMFS_PUBLIC_KEY per-repository in the config.d/ directory. Minimize
    reliance on global CVMFS_KEYS_DIR. When rotating keys, add the new key
    to the per-repository config and remove the old key promptly after rotation.
  template: |
    # /etc/cvmfs/config.d/repo.example.org.conf:
    CVMFS_SERVER_URL=http://stratum1.example.org/cvmfs/repo.example.org
    CVMFS_PUBLIC_KEY=/etc/cvmfs/keys/repo.example.org.pub

known_na_reasons: []
