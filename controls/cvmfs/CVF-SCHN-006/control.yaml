id: CVF-SCHN-006
component: cvmfs
category: supply-chain
title: "CVMFS client must reject repository revisions older than the highest-seen revision"
description: |
  Verifies that CVMFS client-side revision tracking is active and that operational
  procedures do not inadvertently disable it by wiping the client cache wholesale.
  Once a client has seen a given repository revision, the client refuses to accept
  any older revision on subsequent loads. This prevents a network attacker or
  compromised mirror from serving a previously-signed revision that re-introduces
  known-vulnerable software while appearing to pass signature validation.

severity: medium

sources:
  - type: vendor_doc
    authority: strong
    title: "CernVM-FS — Security Deep Dive"
    url: "https://cvmfs.readthedocs.io/en/stable/apx-security.html"
    accessed_at: "2026-05-17"

check:
  type: human_review
  globs:
    - "**/default.local"
    - "**/etc/cvmfs/**"
    - "**/cvmfs/*.conf"
  prompt: |
    Verify that client-side revision tracking is active and that cache-flush
    procedures preserve the revision watermark.

    COMPLIANT if:
      - No CVMFS configuration option disables revision tracking (no
        CVMFS_DISABLE_REVISION_TRACKING or equivalent flag).
      - Documented cache-flush procedures do not include commands that
        wipe the entire cache directory (which would also erase the
        highest-seen revision watermark).
      - If a full cache flush is ever required, it is performed under a
        controlled change window and the operator is aware that rollback
        protection resets.

    NON-COMPLIANT if:
      - A configuration option explicitly disables revision tracking.
      - An operational runbook includes a routine cache-flush command that
        resets revision watermarks without a change-window process.

    NEEDS-HUMAN if:
      - Revision tracking state requires inspecting the live client cache
        (e.g., /var/lib/cvmfs/<repo>/revision) on the target host.

remediation:
  summary: |
    Confirm no CVMFS configuration disables revision tracking. Remove any
    routine cache-flush commands from operational playbooks that would reset
    the highest-seen revision watermark.
  template: |
    # Check revision watermark in client cache:
    cat /var/lib/cvmfs/<repo.example.org>/revision

    # Verify no tracking is disabled:
    grep -r DISABLE_REVISION /etc/cvmfs/

known_na_reasons: []
